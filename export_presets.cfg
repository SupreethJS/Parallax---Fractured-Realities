html/head_include="<style>@media screen and (orientation: portrait) and (max-width: 950px) { #mobile-rotate-overlay { display: flex !important; } } #mobile-rotate-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(7, 9, 14, 0.96); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 999999; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #f1f5f9; } #mobile-rotate-overlay .phone-icon { width: 64px; height: 64px; margin-bottom: 20px; animation: rotatePhone 2.4s ease-in-out infinite; } @keyframes rotatePhone { 0%, 25% { transform: rotate(0deg); } 50%, 75% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } } #mobile-rotate-overlay h2 { color: #08d2fa; font-size: 1.25rem; font-weight: 800; margin: 0 0 10px 0; letter-spacing: 0.5px; } #mobile-rotate-overlay p { color: #94a3b8; font-size: 0.88rem; max-width: 320px; margin: 0 0 24px 0; line-height: 1.4; } #mobile-rotate-overlay .fs-btn { background: #08d2fa; color: #07090e; font-weight: 800; font-size: 0.95rem; border: none; border-radius: 8px; padding: 12px 28px; cursor: pointer; box-shadow: 0 0 20px rgba(8, 210, 250, 0.4); } #mobile-rotate-overlay .fs-btn:active { transform: scale(0.96); }</style><script>function toggleWebFullscreen(){var el=document.documentElement;if(!document.fullscreenElement){if(el.requestFullscreen)el.requestFullscreen().catch(function(){});else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();}else{if(document.exitFullscreen)document.exitFullscreen().catch(function(){});else if(document.webkitExitFullscreen)document.webkitExitFullscreen();}if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}}document.addEventListener('DOMContentLoaded',function(){if(!document.getElementById('mobile-rotate-overlay')){var div=document.createElement('div');div.id='mobile-rotate-overlay';div.innerHTML='<svg class=\"phone-icon\" viewBox=\"0 0 64 64\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"22\" y=\"10\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#0e1726\" stroke=\"#08d2fa\" stroke-width=\"2\"/><circle cx=\"32\" cy=\"48\" r=\"2\" fill=\"#08d2fa\"/><path d=\"M 46 16 A 22 22 0 0 1 52 38\" stroke=\"#f43f5e\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><path d=\"M 49 40 L 53 37 L 55 43 Z\" fill=\"#f43f5e\"/></svg><h2>PLEASE ROTATE YOUR DEVICE</h2><p>PARALLAX: FRACTURED REALITIES is optimized for landscape play.</p><button class=\"fs-btn\" onclick=\"toggleWebFullscreen()\">⛶ ENTER FULLSCREEN</button>';document.body.appendChild(div);}});</script>"
